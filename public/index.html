<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACI Extraction Demandes Clients</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f3f0;
      padding: 2rem;
      margin: 0;
      color: #2c2a27;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 2rem;
    }
    .section {
      background: white;
      border: 1px solid #e0ddd8;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .section-header {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #888;
      margin-bottom: 1rem;
      border-bottom: 2px solid #f1efe8;
      padding-bottom: 0.6rem;
    }
    textarea, input, select {
      font-family: inherit;
      padding: 12px;
      border: 1px solid #d3d1c7;
      border-radius: 4px;
      font-size: 13px;
      width: 100%;
      margin-bottom: 1rem;
    }
    textarea {
      min-height: 120px;
      font-family: monospace;
    }
    button {
      padding: 10px 16px;
      background: #185fa5;
      color: white;
      border: 1px solid #185fa5;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #134080;
    }
    button.secondary {
      background: white;
      color: #2c2a27;
      border: 1px solid #d3d1c7;
    }
    button.secondary:hover {
      background: #f9f8f6;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      display: none;
      padding: 12px;
      border-radius: 4px;
      margin: 1rem 0;
      font-size: 13px;
      border: 1px solid #b5d4f4;
      background: #e6f1fb;
      color: #185fa5;
    }
    .status.error {
      background: #fde6e6;
      border-color: #f4b5b5;
      color: #a51818;
    }
    .hidden {
      display: none !important;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      margin-top: 1rem;
    }
    th {
      background: #f1efe8;
      border-bottom: 2px solid #d3d1c7;
      padding: 8px 6px;
      text-align: left;
      font-weight: 600;
      color: #444;
    }
    td {
      padding: 6px;
      border-bottom: 1px solid #e0ddd8;
    }
    td input {
      width: 100%;
      padding: 4px 6px;
      margin: 0;
      border: 1px solid #d3d1c7;
    }
    .button-group {
      display: flex;
      gap: 1rem;
    }
    .input-tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      border-bottom: 2px solid #e0ddd8;
    }
    .tab-btn {
      padding: 10px 16px;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-weight: 500;
      color: #888;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: #185fa5;
      border-bottom-color: #185fa5;
    }
    .input-content {
      display: none;
    }
    .input-content.active {
      display: block;
    }
    .drop-zone {
      border: 2px dashed #d3d1c7;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #fafaf8;
    }
    .drop-zone:hover {
      border-color: #185fa5;
      background: #f0f7ff;
    }
    .drop-zone.dragover {
      border-color: #185fa5;
      background: #e6f1fb;
    }
    .drop-zone p {
      margin: 0.5rem 0;
      color: #666;
      font-size: 13px;
    }
    .file-input-hidden {
      display: none;
    }
    /* Loader styles */
    .loader-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    .loader-overlay.show {
      display: flex;
    }
    .loader-box {
      background: white;
      border-radius: 8px;
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      min-width: 300px;
    }
    .spinner {
      width: 60px;
      height: 60px;
      margin: 0 auto 1.5rem;
      border: 4px solid #e0ddd8;
      border-top-color: #185fa5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loader-text {
      font-size: 14px;
      color: #2c2a27;
      font-weight: 500;
      margin: 0;
    }
    /* Modal styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal-box {
      background: white;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 1rem 0;
      color: #2c2a27;
    }
    .preview-items {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2rem;
      max-height: 350px;
      overflow-y: auto;
    }
    .preview-item {
      background: white;
      border: 1px solid #e0ddd8;
      border-radius: 4px;
      padding: 0.75rem;
      font-size: 12px;
    }
    .preview-item-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem 1rem;
      margin-bottom: 0.5rem;
    }
    .preview-item-row:last-child {
      margin-bottom: 0;
    }
    .preview-field {
      display: flex;
      gap: 0.5rem;
    }
    .preview-label {
      font-weight: 600;
      color: #888;
      min-width: 80px;
    }
    .preview-value {
      color: #2c2a27;
      word-break: break-word;
      flex: 1;
    }
    .preview-value.empty {
      color: #ccc;
      font-style: italic;
    }
    .language-selector {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      justify-content: center;
    }
    .lang-btn {
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid #d3d1c7;
      border-radius: 4px;
      background: white;
      color: #2c2a27;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
      max-width: 120px;
    }
    .lang-btn:hover:not(:disabled) {
      background: #f0f7ff;
      border-color: #185fa5;
      color: #185fa5;
    }
    .lang-btn.primary {
      background: #185fa5;
      color: white;
      border-color: #185fa5;
    }
    .lang-btn.primary:hover {
      background: #134080;
    }
    .lang-btn.cancel {
      border-color: #d3d1c7;
    }
    .lang-btn.cancel:hover {
      background: #f5f3f0;
    }
    .lang-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>ACI Extraction Demandes Clients</h1>

  <!-- ÉTAPE 1: Importer demande -->
  <div id="step1" class="section">
    <div class="section-header">Étape 1 - Importer demande</div>

    <!-- Input method tabs -->
    <div class="input-tabs">
      <button class="tab-btn active" onclick="switchTab('text')">Texte</button>
      <button class="tab-btn" onclick="switchTab('pdf')">PDF</button>
      <button class="tab-btn" onclick="switchTab('excel')">Excel</button>
    </div>

    <!-- Text input tab -->
    <div id="text-input" class="input-content active">
      <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 0.5rem;">Demande client</label>
      <textarea id="demandInput" placeholder="Collez la demande client ici"></textarea>
    </div>

    <!-- PDF input tab -->
    <div id="pdf-input" class="input-content">
      <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 1rem;">Fichier PDF</label>
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('pdfFile').click()">
        <p style="font-size: 24px;">📄</p>
        <p style="font-weight: 600;">Déposez votre PDF ici</p>
        <p>ou cliquez pour parcourir</p>
      </div>
      <input type="file" id="pdfFile" class="file-input-hidden" accept=".pdf" onchange="handlePdfSelect()" />
      <div id="pdfFileName" style="margin-top: 1rem; font-size: 12px; color: #666;"></div>
    </div>

    <!-- Excel input tab -->
    <div id="excel-input" class="input-content">
      <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 1rem;">Fichier Excel</label>
      <div class="drop-zone" id="excelDropZone" onclick="document.getElementById('excelFile').click()">
        <p style="font-size: 24px;">📊</p>
        <p style="font-weight: 600;">Déposez votre Excel ici</p>
        <p>ou cliquez pour parcourir</p>
      </div>
      <input type="file" id="excelFile" class="file-input-hidden" accept=".xlsx,.xls,.csv" onchange="handleExcelSelect()" />
      <div id="excelFileName" style="margin-top: 1rem; font-size: 12px; color: #666;"></div>
    </div>

    <div id="status1" class="status"></div>

    <button id="extractBtn" onclick="extraire()">Extraire & matcher</button>
  </div>

  <!-- ÉTAPE 2: Éditer & exporter -->
  <div id="step2" class="section hidden">
    <div class="section-header">Étape 2 - Éditer & exporter</div>

    <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 0.5rem;">Export langue</label>
    <select id="outputLanguage" style="margin-bottom: 1rem;">
      <option value="FR">Français</option>
      <option value="EN">English</option>
    </select>

    <div id="tableContainer"></div>

    <div id="status2" class="status"></div>

    <div class="button-group" style="margin-top: 1.5rem;">
      <button id="exportBtn" onclick="exporterExcel()">Télécharger Excel</button>
      <button class="secondary" onclick="reinitialiser()">Nouvelle demande</button>
    </div>
  </div>

</div>

<!-- Loader overlay -->
<div id="loaderOverlay" class="loader-overlay">
  <div class="loader-box">
    <div class="spinner"></div>
    <p class="loader-text">Traitement du PDF en cours...</p>
    <p style="font-size: 12px; color: #888; margin-top: 0.5rem;">Veuillez patienter</p>
  </div>
</div>

<!-- Preview Modal -->
<div id="previewModal" class="modal-overlay">
  <div class="modal-box">
    <h3 class="modal-title">Aperçu de l'extraction</h3>
    <div class="preview-items" id="previewContent">
      <p style="text-align: center; color: #888;">Chargement...</p>
    </div>
    <div class="language-selector">
      <button class="lang-btn cancel" onclick="closePreviewModal()">Annuler</button>
      <button class="lang-btn primary" onclick="completeExtraction('FR')">Français</button>
      <button class="lang-btn primary" onclick="completeExtraction('EN')">English</button>
    </div>
  </div>
</div>

<script>
  const API_URL = window.location.hostname === 'localhost'
    ? 'http://localhost:3000'
    : 'https://web-production-1ee082.up.railway.app';
  let extractedData = [];
  let currentTab = 'text';
  let previewPending = {
    demand: null,
    fileType: null
  };

  function switchTab(tab) {
    currentTab = tab;

    // Update tab buttons
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    // Update content
    document.getElementById('text-input').classList.toggle('active', tab === 'text');
    document.getElementById('pdf-input').classList.toggle('active', tab === 'pdf');
    document.getElementById('excel-input').classList.toggle('active', tab === 'excel');
  }

  function handlePdfSelect() {
    const fileInput = document.getElementById('pdfFile');
    const fileNameDiv = document.getElementById('pdfFileName');

    if (fileInput.files.length > 0) {
      const file = fileInput.files[0];
      fileNameDiv.textContent = `✓ ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
    }
  }

  function handleExcelSelect() {
    const fileInput = document.getElementById('excelFile');
    const fileNameDiv = document.getElementById('excelFileName');

    if (fileInput.files.length > 0) {
      const file = fileInput.files[0];
      fileNameDiv.textContent = `✓ ${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
    }
  }

  // Drag and drop handling
  const dropZone = document.getElementById('dropZone');

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');

    const files = e.dataTransfer.files;
    if (files.length > 0) {
      document.getElementById('pdfFile').files = files;
      handlePdfSelect();
    }
  });

  // Drag and drop for Excel
  const excelDropZone = document.getElementById('excelDropZone');

  excelDropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    excelDropZone.classList.add('dragover');
  });

  excelDropZone.addEventListener('dragleave', () => {
    excelDropZone.classList.remove('dragover');
  });

  excelDropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    excelDropZone.classList.remove('dragover');

    const files = e.dataTransfer.files;
    if (files.length > 0) {
      document.getElementById('excelFile').files = files;
      handleExcelSelect();
    }
  });

  function showLoader(show) {
    const loader = document.getElementById('loaderOverlay');
    if (show) {
      loader.classList.add('show');
    } else {
      loader.classList.remove('show');
    }
  }

  async function extraire() {
    const status = document.getElementById('status1');
    const btn = document.getElementById('extractBtn');

    try {
      showStatus('⏳ Génération aperçu...', 'status1', false);
      btn.disabled = true;

      let demand = null;
      let fileType = null;

      if (currentTab === 'text') {
        demand = document.getElementById('demandInput').value.trim();

        if (!demand) {
          showStatus('Fournissez une demande', 'status1', true);
          btn.disabled = false;
          return;
        }
        fileType = 'text';
      } else if (currentTab === 'pdf') {
        const fileInput = document.getElementById('pdfFile');

        if (!fileInput.files || fileInput.files.length === 0) {
          showStatus('Fournissez un fichier PDF', 'status1', true);
          btn.disabled = false;
          return;
        }

        showLoader(true);

        // Parse PDF to get text
        const pdfBuffer = await fileInput.files[0].arrayBuffer();
        const formDataForPreview = new FormData();
        formDataForPreview.append('file', fileInput.files[0]);
        formDataForPreview.append('language', 'FR'); // Preview always in FR

        const pdfResponse = await fetch(`${API_URL}/api/extract-pdf`, {
          method: 'POST',
          body: formDataForPreview
        });

        if (!pdfResponse.ok) {
          const error = await pdfResponse.json();
          throw new Error(error.error || 'Erreur extraction PDF');
        }

        const pdfResult = await pdfResponse.json();
        extractedData = pdfResult.data;

        showLoader(false);
        btn.disabled = false;
        showPreviewModal(extractedData);
        return;

      } else if (currentTab === 'excel') {
        const fileInput = document.getElementById('excelFile');

        if (!fileInput.files || fileInput.files.length === 0) {
          showStatus('Fournissez un fichier Excel', 'status1', true);
          btn.disabled = false;
          return;
        }

        showLoader(true);

        const formDataForPreview = new FormData();
        formDataForPreview.append('file', fileInput.files[0]);
        formDataForPreview.append('language', 'FR'); // Preview always in FR

        const excelResponse = await fetch(`${API_URL}/api/extract-excel`, {
          method: 'POST',
          body: formDataForPreview
        });

        if (!excelResponse.ok) {
          const error = await excelResponse.json();
          throw new Error(error.error || 'Erreur extraction Excel');
        }

        const excelResult = await excelResponse.json();
        extractedData = excelResult.data;

        showLoader(false);
        btn.disabled = false;
        showPreviewModal(extractedData);
        return;
      }

      // For text input, show preview modal
      if (fileType === 'text') {
        showStatus('', 'status1', false); // Clear status
        previewPending.demand = demand;
        previewPending.fileType = fileType;

        try {
          const previewResponse = await fetch(`${API_URL}/api/extract-preview`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ demand, fileType: 'text', language: 'FR' })
          });

          if (previewResponse.ok) {
            const previewResult = await previewResponse.json();
            extractedData = previewResult.data;
            showPreviewModal(extractedData);
          } else {
            throw new Error('Erreur lors de la génération du prévu');
          }
        } catch (err) {
          throw err;
        }
      }

      btn.disabled = false;
    } catch (err) {
      btn.disabled = false;
      showLoader(false);
      console.error('Erreur:', err);
      showStatus(`❌ ${err.message}`, 'status1', true);
    }
  }

  function showPreviewModal(data) {
    const previewContent = document.getElementById('previewContent');
    const preview = data.slice(0, 5); // Show only first 5 items

    let html = '';
    preview.forEach((item, idx) => {
      html += `<div class="preview-item">`;
      html += `<div style="font-weight: 600; color: #185fa5; margin-bottom: 0.5rem;">Produit ${idx + 1}</div>`;
      html += `<div class="preview-item-row">`;

      // Row 1: Code, Famille
      html += `<div class="preview-field">`;
      html += `<span class="preview-label">Code:</span>`;
      html += `<span class="preview-value ${!item.code_article ? 'empty' : ''}">${item.code_article || '—'}</span>`;
      html += `</div>`;
      html += `<div class="preview-field">`;
      html += `<span class="preview-label">Famille:</span>`;
      html += `<span class="preview-value ${!item.famille ? 'empty' : ''}">${item.famille || '—'}</span>`;
      html += `</div>`;

      html += `</div><div class="preview-item-row">`;

      // Row 2: Désignation
      html += `<div class="preview-field" style="grid-column: 1/-1;">`;
      html += `<span class="preview-label">Désignation:</span>`;
      html += `<span class="preview-value ${!item.designation ? 'empty' : ''}">${item.designation || '—'}</span>`;
      html += `</div>`;

      html += `</div><div class="preview-item-row">`;

      // Row 3: Matière, Norme
      html += `<div class="preview-field">`;
      html += `<span class="preview-label">Matière:</span>`;
      html += `<span class="preview-value ${!item.matiere ? 'empty' : ''}">${item.matiere || '—'}</span>`;
      html += `</div>`;
      html += `<div class="preview-field">`;
      html += `<span class="preview-label">Norme:</span>`;
      html += `<span class="preview-value ${!item.norme ? 'empty' : ''}">${item.norme || '—'}</span>`;
      html += `</div>`;

      html += `</div><div class="preview-item-row">`;

      // Row 4: Quantité, Unité
      html += `<div class="preview-field">`;
      html += `<span class="preview-label">Quantité:</span>`;
      html += `<span class="preview-value ${!item.quantite ? 'empty' : ''}">${item.quantite || '—'}</span>`;
      html += `</div>`;
      html += `<div class="preview-field">`;
      html += `<span class="preview-label">Unité:</span>`;
      html += `<span class="preview-value ${!item.unite ? 'empty' : ''}">${item.unite || '—'}</span>`;
      html += `</div>`;

      html += `</div>`;
      html += `</div>`;
    });

    previewContent.innerHTML = html;

    const modal = document.getElementById('previewModal');
    modal.classList.add('show');
  }

  function closePreviewModal() {
    const modal = document.getElementById('previewModal');
    modal.classList.remove('show');
    document.getElementById('extractBtn').disabled = false;
    document.getElementById('status1').classList.add('hidden');
  }

  async function completeExtraction(language) {
    const modal = document.getElementById('previewModal');
    const status = document.getElementById('status1');
    const btn = document.getElementById('extractBtn');

    try {
      modal.classList.remove('show');
      showLoader(true);
      btn.disabled = true;

      let response;

      if (currentTab === 'text') {
        const demand = previewPending.demand;

        response = await fetch(`${API_URL}/api/extract`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ demand, language })
        });
      } else if (currentTab === 'pdf') {
        const fileInput = document.getElementById('pdfFile');
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('language', language);

        response = await fetch(`${API_URL}/api/extract-pdf`, {
          method: 'POST',
          body: formData
        });
      } else if (currentTab === 'excel') {
        const fileInput = document.getElementById('excelFile');
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('language', language);

        response = await fetch(`${API_URL}/api/extract-excel`, {
          method: 'POST',
          body: formData
        });
      }

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error || 'Erreur API');
      }

      const result = await response.json();
      extractedData = result.data;

      showLoader(false);
      btn.disabled = false;
      showStatus(`✓ ${extractedData.length} produit(s) extrait(s)`, 'status1', false);

      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
      document.getElementById('outputLanguage').value = language;
      afficherTableau();
    } catch (err) {
      showLoader(false);
      btn.disabled = false;
      console.error('Erreur:', err);
      showStatus(`❌ ${err.message}`, 'status1', true);
      modal.classList.add('show');
    }
  }

  function afficherTableau() {
    const lang = document.getElementById('outputLanguage').value;
    const headers = lang === 'FR'
      ? ['Réf client', 'Code', 'Famille', 'Désignation', 'Norme', 'Matière', 'Finish', 'Dimensions', 'Longueur', 'Quantité', 'Unité', 'Délai', 'Notes']
      : ['Ref', 'Code', 'Family', 'Description', 'Standard', 'Material', 'Finish', 'Dimensions', 'Length', 'Qty', 'Unit', 'Lead time', 'Notes'];

    const keys = ['ref_client', 'code_article', 'famille', 'designation', 'norme', 'matiere', 'finish', 'dimensions', 'longueur_ml', 'quantite', 'unite', 'delai', 'notes'];

    let html = '<table><thead><tr>';
    headers.forEach(h => html += `<th>${h}</th>`);
    html += '</tr></thead><tbody>';

    extractedData.forEach((item, idx) => {
      html += '<tr>';
      keys.forEach(key => {
        const value = item[key] || '';
        html += `<td><input type="text" value="${value.replace(/"/g, '&quot;')}" data-idx="${idx}" data-key="${key}" onchange="updateData(this)" /></td>`;
      });
      html += '</tr>';
    });

    html += '</tbody></table>';
    document.getElementById('tableContainer').innerHTML = html;
  }

  function updateData(el) {
    const idx = el.dataset.idx;
    const key = el.dataset.key;
    extractedData[idx][key] = el.value;
  }

  async function exporterExcel() {
    try {
      if (!extractedData || extractedData.length === 0) {
        showStatus('Pas de données à exporter', 'status2', true);
        return;
      }

      const lang = document.getElementById('outputLanguage').value;
      const btn = document.getElementById('exportBtn');
      btn.disabled = true;
      showStatus('⏳ Génération Excel...', 'status2', false);

      const response = await fetch(`${API_URL}/api/export-excel`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: extractedData, language: lang })
      });

      if (!response.ok) {
        throw new Error('Erreur génération Excel');
      }

      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ACI_Demande_${new Date().toISOString().slice(0, 10)}.xlsx`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);

      btn.disabled = false;
      showStatus('✓ Excel téléchargé', 'status2', false);
    } catch (err) {
      document.getElementById('exportBtn').disabled = false;
      console.error('Erreur:', err);
      showStatus(`❌ ${err.message}`, 'status2', true);
    }
  }

  function reinitialiser() {
    document.getElementById('demandInput').value = '';
    document.getElementById('pdfFile').value = '';
    document.getElementById('pdfFileName').textContent = '';
    document.getElementById('excelFile').value = '';
    document.getElementById('excelFileName').textContent = '';
    document.getElementById('step1').classList.remove('hidden');
    document.getElementById('step2').classList.add('hidden');
    extractedData = [];
    document.getElementById('tableContainer').innerHTML = '';
    document.getElementById('status1').classList.add('hidden');
    document.getElementById('status2').classList.add('hidden');
  }

  function showStatus(msg, id, isError) {
    const status = document.getElementById(id);
    status.textContent = msg;
    status.classList.toggle('error', isError);
    status.classList.remove('hidden');
  }
</script>

</body>
</html>
